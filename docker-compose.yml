version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: deskfree_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: deskfree
      POSTGRES_PASSWORD: deskfree_secret
      POSTGRES_DB: deskfree
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U deskfree']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
